<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stralingstijd Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: #4a4a4a;
            color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        h1 {
            color: #F5DF4D;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .calculator-card {
            background: #333;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            border: 1px solid #555;
            box-sizing: border-box;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #f4f4f4;
            font-size: 1rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #f4f4f4;
            color: #333;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #F5DF4D;
            box-shadow: 0 0 5px rgba(245, 223, 77, 0.5);
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
        }
        .checkbox-label {
            color: #fff;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .checkbox-label input {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        /* Toggle Switch Factor */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #3d3d3d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            border: 1px solid #555;
            transition: border-color 0.3s;
        }
        .toggle-container:hover {
            border-color: #F5DF4D;
        }
        .toggle-label {
            margin: 0;
            color: #f4f4f4;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #F5DF4D;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #333;
        }

        /* Materiaalfactor Sectie */
        .keuze-sectie {
            background-color: #262626;
            padding: 15px;
            border-radius: 8px;
            margin-top: -10px;
            margin-bottom: 20px;
            border: 1px solid #555;
            animation: fadeIn 0.3s ease-in-out;
            text-align: left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .active-source-indicator {
            background: #1e1e1e;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .active-source-indicator strong {
            color: #F5DF4D;
            font-size: 1rem;
        }

        .material-search-container {
            position: relative;
            margin-bottom: 15px;
        }
        .search-box-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            gap: 8px;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            color: #777;
            font-size: 0.95rem;
            pointer-events: none;
            z-index: 1;
        }
        .search-input {
            width: 100%;
            padding: 12px 42px 12px 36px !important;
            background-color: #f4f4f4;
            border: 1px solid #555;
            border-radius: 8px;
            color: #222;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #F5DF4D;
            box-shadow: 0 0 5px rgba(245, 223, 77, 0.5);
        }
        .clear-search-btn {
            position: absolute;
            right: 54px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 8px;
            line-height: 1;
            z-index: 2;
        }
        .clear-search-btn:hover {
            color: #222;
        }
        .browse-btn {
            background-color: #404040;
            border: 1px solid #555;
            color: #F5DF4D;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .browse-btn:hover {
            background-color: #4f4f4f;
            border-color: #F5DF4D;
        }

        .search-results-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background-color: #1e1e1e;
            border: 1px solid #555;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85);
            z-index: 1000;
            -webkit-overflow-scrolling: touch;
            text-align: left;
        }
        .search-group-header {
            padding: 7px 12px;
            background-color: #111;
            color: #F5DF4D;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .search-item {
            padding: 10px 12px;
            border-bottom: 1px solid #2d2d2d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            box-sizing: border-box;
            transition: background-color 0.15s;
        }
        .search-item:active, .search-item:hover {
            background-color: #333;
        }
        .search-item.active {
            background-color: #38341e;
            border-left: 3px solid #F5DF4D;
        }
        .search-item-info {
            flex: 1;
            padding-right: 10px;
        }
        .search-item-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 0.95rem;
            line-height: 1.2;
        }
        .search-item-sub {
            font-size: 0.78rem;
            color: #aaa;
            margin-top: 3px;
        }
        .search-item-factor {
            font-size: 1.05rem;
            font-weight: bold;
            color: #F5DF4D;
            white-space: nowrap;
            background: rgba(245, 223, 77, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(245, 223, 77, 0.25);
        }
        .search-no-results {
            padding: 15px;
            text-align: center;
            color: #aaa;
            font-style: italic;
            font-size: 0.9rem;
        }

        .selected-badge {
            margin-top: 8px;
            padding: 8px 12px;
            background: #1e1e1e;
            border-left: 3px solid #F5DF4D;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            animation: fadeIn 0.2s ease-in-out;
        }
        .selected-badge-content {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #eee;
        }
        .badge-remove-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .badge-remove-btn:hover {
            color: #ff5555;
        }

        .result-box {
            margin-top: 25px;
            background-color: #222;
            border: 2px solid #F5DF4D;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* Resultaat items met timer knop */
        .result-item {
            font-size: 1.15rem;
            margin: 10px 0;
            color: #f4f4f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #3d3d3d;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
            text-align: left;
        }
        .result-filmtype {
            font-weight: bold;
            color: #fff;
            font-size: 1.25rem;
            min-width: 32px;
        }
        .result-time {
            color: #F5DF4D;
            font-weight: bold;
            font-size: 1.45rem;
        }
        .timer-open-btn {
            background-color: #383838;
            color: #F5DF4D;
            border: 1px solid #F5DF4D;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .timer-open-btn:hover {
            background-color: #F5DF4D;
            color: #1a1a1a;
            transform: scale(1.03);
        }
        .timer-open-btn:active {
            transform: scale(0.97);
        }
        
        .home-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            text-decoration: none;
            z-index: 10;
        }
        
        .home-icon:hover {
            color: #F5DF4D;
        }

        .watch-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            z-index: 10;
            transition: color 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
        }

        .watch-link:hover {
            color: #F5DF4D;
            transform: scale(1.15);
        }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .watch-link {
                display: none !important;
            }
        }

        /* --- TIMER MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #262626;
            margin: 35px auto;
            padding: 25px 20px;
            border: 2px solid #555;
            width: 90%;
            max-width: 420px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
            text-align: center;
            animation: modalFadeIn 0.25s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #F5DF4D;
        }

        .timer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .timer-header h2 {
            margin: 0;
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-film-badge {
            background: #F5DF4D;
            color: #1a1a1a;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Countdown display */
        .timer-display-box {
            background: #181818;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px 15px;
            margin-bottom: 20px;
            transition: border-color 0.3s, background-color 0.3s;
        }
        .timer-countdown-text {
            display: block;
            font-size: 3.4rem;
            font-weight: bold;
            color: #F5DF4D;
            font-family: 'Roboto Condensed', monospace;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 0 0 15px rgba(245, 223, 77, 0.3);
        }
        .timer-status-text {
            font-size: 0.95rem;
            color: #aaa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .flashing-box {
            animation: timerAlarmFlash 0.5s infinite alternate !important;
            border-color: #ff3333 !important;
        }
        @keyframes timerAlarmFlash {
            from { background-color: #181818; box-shadow: 0 0 10px rgba(255, 50, 50, 0.4); }
            to { background-color: #771111; box-shadow: 0 0 25px rgba(255, 50, 50, 0.9); }
        }

        /* Tijd aanpassen */
        .timer-adjust-group {
            background: #202020;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .timer-adjust-label {
            display: block;
            margin-bottom: 10px;
            color: #ddd;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .timer-inputs-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0;
        }
        .timer-input-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }
        .timer-input-wrap input {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 8px;
            background: #111;
            color: #F5DF4D;
            border: 1px solid #555;
            border-radius: 6px;
        }
        .timer-unit {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .timer-colon {
            font-size: 1.8rem;
            font-weight: bold;
            color: #888;
            margin-bottom: 18px;
        }

        /* Controls: Start, Pauze, Reset */
        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .timer-ctrl-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
        }
        .timer-ctrl-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .timer-ctrl-btn:not(:disabled):hover {
            transform: translateY(-2px);
        }
        .timer-ctrl-btn:not(:disabled):active {
            transform: translateY(0);
        }
        .btn-start {
            background-color: #F5DF4D;
            color: #1a1a1a;
        }
        .btn-pause {
            background-color: #ff9800;
            color: #1a1a1a;
        }
        .btn-reset {
            background-color: #4a4a4a;
            color: #fff;
        }
        .btn-alarm-stop {
            background-color: #e53935;
            color: #fff;
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        .timer-lock-warning {
            margin-top: 15px;
            padding: 9px 12px;
            background-color: rgba(245, 223, 77, 0.1);
            border: 1px solid rgba(245, 223, 77, 0.35);
            border-radius: 8px;
            color: #e0d080;
            font-size: 0.82rem;
            line-height: 1.35;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .timer-lock-warning i {
            color: #F5DF4D;
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        /* Floating mini timer badge when modal is closed while running */
        .active-timer-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e1e1e;
            color: #F5DF4D;
            border: 2px solid #F5DF4D;
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 1500;
            display: none;
            align-items: center;
            gap: 8px;
            animation: floatIn 0.3s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .calculator-card {
                padding: 1.25rem;
            }
            h1 {
                font-size: 1.8rem;
                margin-top: 40px;
            }
            .timer-countdown-text {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-icon" title="Terug naar Home"><i class="fas fa-home"></i></a>
    <a href="https://github.com/vincepall/stralingstijd-watch" target="_blank" rel="noopener noreferrer" class="watch-link" title="Wear OS Watch App op GitHub (stralingstijd-watch)" aria-label="Wear OS Watch App op GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="6"/>
            <polyline points="12 10 12 12 14 14"/>
            <path d="m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.64a2 2 0 0 0-2 1.61l-.81 4.05"/>
            <path d="m7.87 16.34.81 4.05a2 2 0 0 0 2 1.61h2.64a2 2 0 0 0 2-1.61l.81-4.05"/>
        </svg>
    </a>

    <h1>Gamma Stralingstijd</h1>

<div class="calculator-card">
    <div class="input-group">
        <label for="sourceSelect">Kies een bron</label>
        <select id="sourceSelect" onchange="onSourceChanged()">
            <option value="" disabled selected>Laden...</option>
        </select>
    </div>

    <!-- Hidden field for calculation logic -->
    <input type="hidden" id="isotope" value="Ir192">

    <div class="input-group" id="ciInputGroup"> 
        <label>Activiteit (Ci)</label>
        <input type="number" id="ci" step="0.1" oninput="calculate()">
    </div>
    
    <div style="margin-bottom: 15px; color: #aaa; font-size: 0.9rem; display:none;" id="activityInfoText">
        Automatisch berekend op basis van verval.
    </div>

    <div class="input-group">
        <label for="thickness">Dikte(mm), zoals op schuifje</label>
        <input type="number" id="thickness" value="20" step="1" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="ffd">Film Focus Afstand (cm)</label>
        <input type="number" id="ffd" value="60" step="1" oninput="calculate()">
    </div>
    
    <div class="input-group">
        <label>Film Type(s)</label>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="checkD4" value="D4" checked onchange="calculate()"> D4
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="checkD5" value="D5" checked onchange="calculate()"> D5
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="checkD7" value="D7" checked onchange="calculate()"> D7
            </label>
        </div>
    </div>

    <!-- Materiaalfactor Toggle -->
    <div class="toggle-container" onclick="toggleMaterial()">
        <label class="toggle-label">Factor</label>
        <label class="switch">
            <input type="checkbox" id="material_veranderd">
            <span class="slider"></span>
        </label>
    </div>

    <!-- Materiaalfactor Sectie (Verborgen) -->
    <div id="material_keuze" class="keuze-sectie" style="display: none;">
        <div class="active-source-indicator">
            <i class="fas fa-radiation"></i> Bron voor factor: <strong id="current_source_badge">Ir192</strong>
        </div>

        <div class="form-group">
            <label for="material_search_input">Materiaal zoeken (89 soorten)</label>
            <div class="material-search-container" id="material_search_wrapper">
                <div class="search-box-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="material_search_input" 
                           placeholder="Zoek bijv. 625, C276, Koper, Duplex, P91..." 
                           autocomplete="off" 
                           class="search-input"

        await loadSources();
        await loadMaterialFactors();

        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('material_search_wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeMaterialDropdown();
            }
        });

            const modal = document.getElementById('timerModal');
            if (e.target === modal) {
                closeTimerModal();
            }
        });

        // Event listener direct op checkbox voor toggling
        const matToggle = document.getElementById('material_veranderd');
        if (matToggle) {
            matToggle.addEventListener('change', function() {

                calculate();

    async function loadSources() {
        try {
            const select = document.getElementById('sourceSelect');
            select.innerHTML = '<option value="" disabled selected>Kies een bron...</option>';

            // Manual Options
            const manualIr = document.createElement('option');
            manualIr.value = "manual_Ir192";
            manualIr.text = "Ir192 (Handmatig)";
            select.appendChild(manualIr);

            const manualSe = document.createElement('option');
            manualSe.value = "manual_Se75";
            manualSe.text = "Se75 (Handmatig)";
            select.appendChild(manualSe);

            // Divider
            const divider = document.createElement('option');
            divider.disabled = true;
            divider.text = "--- Opgeslagen Bronnen ---";
            select.appendChild(divider);

            const response = await fetch('bronnen.csv?v=' + Date.now(), { cache: 'no-store' });
            const text = await response.text();
            const lines = text.trim().split('\n').slice(1);

            sourcesData = lines.map(line => {
                const cols = line.split(',');
                if (cols.length < 4) return null;
                return {
                    name: cols[0].trim(),
                    type: cols[1].trim(),
                    initialActivity: parseFloat(cols[2].trim()),
                    date: cols[3].trim()
                };
            }).filter(x => x);

            sourcesData.forEach((src, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                const currentCi = calculateCurrentActivity(src.initialActivity, src.type, src.date);
                opt.text = `${src.name} (${src.type}) [${currentCi.toFixed(2)} Ci]`;
                select.appendChild(opt);
            });
            
        } catch (err) {
            console.error("Error loading bronnen CSV:", err);
        }
    }

    function parseCsvRow(row) {
        const cells = [];
        let inQuotes = false;
        let val = '';
        for (let i = 0; i < row.length; i++) {
            const c = row[i];
            if (c === '"') {
                inQuotes = !inQuotes;
            } else if (c === ',' && !inQuotes) {
                cells.push(val.trim());
                val = '';
            } else {
                val += c;
            }
        }
        cells.push(val.trim());
        return cells;
    }

    async function loadMaterialFactors() {
        let text = "";
        try {
            const response = await fetch('materiaalfactor.csv?v=' + Date.now(), { cache: 'no-store' });
            if (response.ok) {
                text = await response.text();
            }
        } catch (e) {
            console.info("materiaalfactor.csv niet via HTTP geladen, ingebedde lijst wordt gebruikt.");
        }
        if (!text || text.trim().length <= 1) {
            text = EMBEDDED_MATERIAL_CSV;
        }
        const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length <= 1) return;

        materialDatabase = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = parseCsvRow(lines[i]);
            if (cols.length < 5) continue;
            materialDatabase.push({
                name: cols[0],
                werkstoff: cols[1] || '',
                groep: cols[2] || 'Overig',
                f150: parseFloat((cols[3] || '1').replace(',', '.')) || 1.0,
                f200: parseFloat((cols[4] || '1').replace(',', '.')) || 1.0,
                f250: parseFloat((cols[5] || '1').replace(',', '.')) || 1.0,
                f300: parseFloat((cols[6] || '1').replace(',', '.')) || 1.0,
                density: cols[7] ? parseFloat(cols[7].replace(',', '.')) : null,
                notes: cols[8] || '',
                f_se75: cols[9] ? (parseFloat(cols[9].replace(',', '.')) || 1.0) : 1.0,
                f_ir192: cols[10] ? (parseFloat(cols[10].replace(',', '.')) || 1.0) : 1.0
            });
        }

        syncMaterialSelectOptions();
    }

    function getIsotope() {
        const isoElem = document.getElementById('isotope');
        return (isoElem && isoElem.value === 'Se75') ? 'Se75' : 'Ir192';
    }

    function getFactorForIsotope(mat, iso) {
        if (!mat) return 1.0;
        return (iso === 'Se75') ? mat.f_se75 : mat.f_ir192;
    }

    function calculateCurrentActivity(initialCi, type, dateStr) {
        const parts = dateStr.split('-');
        const sourceDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        const today = new Date();
        const days = (today - sourceDate) / (1000 * 60 * 60 * 24);
        const halfLife = (type === 'Se75') ? 120 : 74;
        return initialCi / Math.pow(2, days / halfLife);
    }

    // Fuzzy search engine
    function smartSearchMaterials(query) {
        const qRaw = (query || '').toLowerCase().trim();
        if (!qRaw) return materialDatabase.map((m, idx) => ({ item: m, idx, score: 0 }));
        
        const qClean = qRaw.replace(/[\s\-\/\.]/g, '');
        const qWords = qRaw.split(/\s+/).filter(w => w.length > 0);
        
        const matches = [];
        materialDatabase.forEach((mat, idx) => {
            const nameLower = mat.name.toLowerCase();
            const werkstoffLower = mat.werkstoff.toLowerCase();
            const groupLower = mat.groep.toLowerCase();
            const notesLower = mat.notes.toLowerCase();
            const fullText = `${nameLower} ${werkstoffLower} ${groupLower} ${notesLower}`;
            const fullClean = fullText.replace(/[\s\-\/\.]/g, '');
            
            let score = 0;
            const nameClean = nameLower.replace(/[\s\-\/\.]/g, '');
            if (nameClean === qClean) score += 100;
            else if (nameClean.startsWith(qClean)) score += 60;
            else if (nameClean.includes(qClean)) score += 40;
            else if (werkstoffLower.includes(qRaw) || werkstoffLower.replace(/[\s\-\/\.]/g, '').includes(qClean)) score += 35;
            else if (qWords.every(w => nameLower.includes(w))) score += 30;
            else if (fullClean.includes(qClean) || qWords.every(w => fullText.includes(w))) {
                if (groupLower.includes(qRaw)) score += 15;
                else score += 10;
            }
            
            if (score > 0) {
                matches.push({ item: mat, idx, score });
            }
        });
        matches.sort((a, b) => b.score - a.score);
        return matches;
    }

    function renderSearchResults(query = '') {
        const container = document.getElementById('material_search_results');
        if (!container) return;
        const currentIso = getIsotope();
        const results = smartSearchMaterials(query);
        
        if (results.length === 0) {
            container.innerHTML = `
                <div class="search-no-results">
                    Geen materialen gevonden voor "${escapeHtml(query)}".<br>
                    <span style="font-size: 0.8rem; color: #888;">Voer de factor hieronder handmatig in of wis de zoekopdracht.</span>
                </div>`;
            container.style.display = 'block';
            return;
        }

        let html = '';
        if (!query.trim()) {
            const groups = {};
            results.forEach(({ item, idx }) => {
                if (!groups[item.groep]) groups[item.groep] = [];
                groups[item.groep].push({ item, idx });
            });

            for (const [grpName, items] of Object.entries(groups)) {
                html += `<div class="search-group-header">${escapeHtml(grpName)}</div>`;
                items.forEach(({ item, idx }) => {
                    const factor = getFactorForIsotope(item, currentIso);
                    const isSel = idx === currentSelectedMaterialIndex;
                    html += `
                        <div class="search-item ${isSel ? 'active' : ''}" onclick="selectMaterialByIndex(${idx})">
                            <div class="search-item-info">
                                <div class="search-item-title">${escapeHtml(item.name)}</div>
                                <div class="search-item-sub">${item.werkstoff ? escapeHtml(item.werkstoff) + ' &bull; ' : ''}${escapeHtml(item.notes || item.groep)}</div>
                            </div>
                            <div class="search-item-factor">${factor.toFixed(2)}</div>
                        </div>
                    `;
                });
            }
        } else {
            results.forEach(({ item, idx }) => {
                const factor = getFactorForIsotope(item, currentIso);
                const isSel = idx === currentSelectedMaterialIndex;
                html += `
                    <div class="search-item ${isSel ? 'active' : ''}" onclick="selectMaterialByIndex(${idx})">
                        <div class="search-item-info">
                            <div class="search-item-title">${escapeHtml(item.name)}</div>
                            <div class="search-item-sub">${escapeHtml(item.groep)}${item.werkstoff ? ' &bull; ' + escapeHtml(item.werkstoff) : ''}</div>
                        </div>
                        <div class="search-item-factor">${factor.toFixed(2)}</div>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
        container.style.display = 'block';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function calculate() {
        const iso = document.getElementById('isotope').value || 'Ir192';
        const ci = parseFloat(document.getElementById('ci').value);
        const thick = parseFloat(document.getElementById('thickness').value);
        const ffd_cm = parseFloat(document.getElementById('ffd').value);

        if (!ci || !thick || !ffd_cm) {
             return;
        }

        const consts = CONFIG[iso];
        const ffd_m = ffd_cm / 100.0; 
        
        let base_exposure = (consts.ff * (ffd_m * ffd_m)) / (ci * consts.k);
        let attenuation = Math.pow(2, (thick / consts.hvl));
        
        let time_d7 = base_exposure * attenuation;

        if (iso === 'Se75') time_d7 *= 1.05;

        // Materiaalfactor toepassing
        let matFactor = 1.0;
        const matVeranderd = document.getElementById('material_veranderd');
        if (matVeranderd && matVeranderd.checked) {
            const parsed = parseFloat(document.getElementById('material_factor').value);
            if (!isNaN(parsed) && parsed > 0) {
                matFactor = parsed;
            }
        }
        time_d7 *= matFactor;

        // Berekening voor filmtypes
        // D7 = Base
        // D4 = D7 * 2.44
        // D5 = D4 / 1.6666
        const t_d7 = time_d7;
        const t_d4 = t_d7 * 2.44;
        const t_d5 = t_d4 / 1.6666;

        const resultsContainer = document.getElementById('resultsContainer');
        resultsContainer.innerHTML = '';

        const types = [
            { id: 'checkD4', name: 'D4', val: t_d4 },
            { id: 'checkD5', name: 'D5', val: t_d5 },
            { id: 'checkD7', name: 'D7', val: t_d7 }
        ];

        let hasChecked = false;

        types.forEach(type => {
            if (document.getElementById(type.id).checked) {
                hasChecked = true;
                resultsContainer.innerHTML += `
                    <div class="result-item">
                        <div class="result-item-left">
                            <span class="result-filmtype">${type.name}:</span>
                            <span class="result-time">${formatTime(type.val)}</span>
                        </div>
                        <button type="button" class="timer-open-btn" onclick="openTimerModal('${type.name}', ${type.val})" title="Open timer voor ${type.name}">
                            <i class="fas fa-stopwatch"></i> Timer
                        </button>
                    </div>
                `;
            }
        });

        if (!hasChecked) {
            resultsContainer.innerHTML = '<div class="result-item" style="color:#aaa; justify-content: center;">Vink een filmtype aan.</div>';
        } else if (matVeranderd && matVeranderd.checked && matFactor !== 1.0) {
            let matDesc = "";
            if (currentSelectedMaterialIndex >= 0 && materialDatabase[currentSelectedMaterialIndex]) {
                matDesc = ` (${escapeHtml(materialDatabase[currentSelectedMaterialIndex].name)})`;
            }
            resultsContainer.innerHTML += `
                <div style="margin-top: 14px; font-size: 0.95rem; color: #F5DF4D; border-top: 1px solid #444; padding-top: 10px;">
                    <i class="fas fa-layer-group"></i> Inclusief factor <strong>${matFactor.toFixed(2)}</strong>${matDesc}
                </div>
            `;
        }
    }

    function formatTime(minutesFloat) {
        let m = Math.floor(minutesFloat);
        let s = Math.round((minutesFloat - m) * 60);
        if (s === 60) { m++; s = 0; }
        return `${m}m ${s}s`;
    }

    // --- TIMER SYSTEM FUNCTIONS ---
    function formatCountdown(sec) {
        if (isNaN(sec) || sec < 0) sec = 0;
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        const pad = (n) => (n < 10 ? '0' + n : n);
        if (h > 0) {
            return `${h}:${pad(m)}:${pad(s)}`;
        }
        return `${pad(m)}:${pad(s)}`;
    }

    function openTimerModal(filmType, totalMinutesFloat) {
        currentTimerFilm = filmType;
        document.getElementById('timerFilmBadge').textContent = filmType;

        // Bepaal exacte seconden
        const totalSec = Math.max(1, Math.round(totalMinutesFloat * 60));
        timerConfiguredSeconds = totalSec;
        timerRemainingSeconds = totalSec;

        // Vul invoervelden in
        document.getElementById('timerInputMinutes').value = Math.floor(totalSec / 60);
        document.getElementById('timerInputSeconds').value = totalSec % 60;

        // Reset weergave
        document.getElementById('timerCountdownText').textContent = formatCountdown(totalSec);
        document.getElementById('timerStatusText').textContent = 'Klaar voor start';
        document.getElementById('timerDisplayBox').classList.remove('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'none';

        // Knoppen resetten
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerEndTime = null;
        timerState = 'stopped';
        updateTimerControls();

        // Modal tonen
        document.getElementById('timerModal').style.display = 'block';
        hideFloatingTimer();
    }

    function openActiveTimerModal() {
        document.getElementById('timerModal').style.display = 'block';
        hideFloatingTimer();
    }

    function closeTimerModal() {
        document.getElementById('timerModal').style.display = 'none';
        if (timerState === 'finished') {
            stopAlarm();
        } else if (timerState === 'running') {
            showFloatingTimer();
        }
    }

    function showFloatingTimer() {
        const floatBox = document.getElementById('activeTimerFloat');
        if (!floatBox) return;
        updateFloatingTimerDisplay();
        floatBox.style.display = 'flex';
    }

    function hideFloatingTimer() {
        const floatBox = document.getElementById('activeTimerFloat');
        if (floatBox) floatBox.style.display = 'none';
    }

    function updateFloatingTimerDisplay() {
        const floatText = document.getElementById('floatCountdown');
        if (floatText) {
            floatText.textContent = `${formatCountdown(timerRemainingSeconds)} (${currentTimerFilm})`;
        }
        const floatBox = document.getElementById('activeTimerFloat');
        if (floatBox) {
            if (timerState === 'finished') {
                floatBox.classList.add('flashing-box');
            } else {
                floatBox.classList.remove('flashing-box');
            }
        }
    }

    function syncTimerRemaining() {
        if (timerState !== 'running' || !timerEndTime) return;
        const now = Date.now();
        const diffMs = timerEndTime - now;
        const remainingSec = Math.max(0, Math.ceil(diffMs / 1000));

        timerRemainingSeconds = remainingSec;
        document.getElementById('timerCountdownText').textContent = formatCountdown(timerRemainingSeconds);
        updateFloatingTimerDisplay();

        if (diffMs <= 0) {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerEndTime = null;
            onTimerFinished();
        }
    }

    function onTimerInputsChanged() {
        let m = parseInt(document.getElementById('timerInputMinutes').value) || 0;
        let s = parseInt(document.getElementById('timerInputSeconds').value) || 0;
        if (s >= 60) {
            m += Math.floor(s / 60);
            s = s % 60;
            document.getElementById('timerInputMinutes').value = m;
            document.getElementById('timerInputSeconds').value = s;
        }
        if (m < 0) m = 0;
        if (s < 0) s = 0;

        const newTotal = m * 60 + s;
        timerConfiguredSeconds = newTotal;
        timerRemainingSeconds = newTotal;

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerEndTime = null;
        timerState = 'stopped';

        document.getElementById('timerCountdownText').textContent = formatCountdown(timerRemainingSeconds);
        document.getElementById('timerStatusText').textContent = 'Aangepast • Klaar voor start';
        document.getElementById('timerDisplayBox').classList.remove('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'none';

        updateTimerControls();
        updateFloatingTimerDisplay();
    }

    async function startTimer() {
        if (timerRemainingSeconds <= 0) {
            timerRemainingSeconds = timerConfiguredSeconds;
        }
        if (timerRemainingSeconds <= 0) {
            alert('Stel een geldige tijd in.');
            return;
        }

        timerEndTime = Date.now() + (timerRemainingSeconds * 1000);
        timerState = 'running';
        document.getElementById('timerStatusText').textContent = 'Bezig met aftellen...';
        document.getElementById('timerDisplayBox').classList.remove('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'none';
        updateTimerControls();

        // Audio initialiseren
        const audio = document.getElementById('alarmSound');
        if (audio) {
            audio.load();
        }

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Scherm actief houden via WakeLock
        await requestWakeLock();

        if (timerInterval) clearInterval(timerInterval);
        syncTimerRemaining();
        timerInterval = setInterval(() => {
            syncTimerRemaining();
        }, 250);
    }

    function pauseTimer() {
        if (timerState !== 'running') return;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (timerEndTime) {
            timerRemainingSeconds = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
            timerEndTime = null;
        }
        timerState = 'paused';
        document.getElementById('timerCountdownText').textContent = formatCountdown(timerRemainingSeconds);
        document.getElementById('timerStatusText').textContent = 'Gepauzeerd';
        releaseWakeLock();
        updateTimerControls();
        updateFloatingTimerDisplay();
    }

    function resetTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerEndTime = null;
        stopAlarm();
        timerRemainingSeconds = timerConfiguredSeconds;
        timerState = 'stopped';

        document.getElementById('timerCountdownText').textContent = formatCountdown(timerRemainingSeconds);
        document.getElementById('timerStatusText').textContent = 'Gereset • Klaar voor start';
        document.getElementById('timerDisplayBox').classList.remove('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'none';

        releaseWakeLock();
        updateTimerControls();
        updateFloatingTimerDisplay();
        hideFloatingTimer();
    }

    function onTimerFinished() {
        timerState = 'finished';
        document.getElementById('timerCountdownText').textContent = '00:00';
        document.getElementById('timerStatusText').textContent = 'TIJD VERSTREKEN!';
        document.getElementById('timerDisplayBox').classList.add('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'block';

        const audio = document.getElementById('alarmSound');
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Audio play error:', e));
        }

        // Vibratie op mobiel
        if ('vibrate' in navigator) {
            navigator.vibrate([500, 250, 500, 250, 1000]);
        }

        // Notificatie
        if ('Notification' in window && Notification.permission === 'granted') {
            try {
                new Notification('RT Stralingstijd Voltooid!', {
                    body: `De stralingstijd voor film ${currentTimerFilm} is afgelopen!`,
                    icon: 'RT192.png'
                });
            } catch (e) {}
        }

        releaseWakeLock();
        updateTimerControls();
        updateFloatingTimerDisplay();
    }

    function stopAlarm() {
        const audio = document.getElementById('alarmSound');
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
        }
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerEndTime = null;
        document.getElementById('timerDisplayBox').classList.remove('flashing-box');
        document.getElementById('alarmStopContainer').style.display = 'none';

        // Automatisch resetten naar de oorspronkelijke/geconfigureerde tijd
        timerRemainingSeconds = timerConfiguredSeconds;
        timerState = 'stopped';
        document.getElementById('timerCountdownText').textContent = formatCountdown(timerRemainingSeconds);
        document.getElementById('timerStatusText').textContent = 'Klaar voor start';

        releaseWakeLock();
        updateTimerControls();
        updateFloatingTimerDisplay();
        hideFloatingTimer();
    }

    function updateTimerControls() {
        const btnStart = document.getElementById('btnTimerStart');
        const btnPause = document.getElementById('btnTimerPause');
        const btnReset = document.getElementById('btnTimerReset');

        if (timerState === 'running') {
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnReset.disabled = false;
            btnStart.innerHTML = '<i class="fas fa-play"></i> Start';
        } else if (timerState === 'paused') {
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnReset.disabled = false;
            btnStart.innerHTML = '<i class="fas fa-play"></i> Hervat';
        } else { // stopped of finished
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnReset.disabled = false;
            btnStart.innerHTML = '<i class="fas fa-play"></i> Start';
        }
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log('Wake Lock error:', err);
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && timerState === 'running') {
            syncTimerRemaining();
            if (timerState === 'running') {
                await requestWakeLock();
            }
        }
    });

    window.addEventListener('focus', () => {
        if (timerState === 'running') {
            syncTimerRemaining();
        }
    });
</script>

</body>
</html>
